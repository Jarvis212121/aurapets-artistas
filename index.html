<!DOCTYPE html>
<html lang="es" class="h-full dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AuraPets | Atelier de Artistas de Esculturas</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Valores públicos de despliegue; no poner credenciales aquí. -->
  <script src="./config.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            aura: {
              gold: '#C79B45',
              goldLight: '#E3C37B',
              goldGlow: '#F5D77F',
              ivory: '#FFFDFC',
              beige: '#E6DDD5',
            }
          },
          fontFamily: {
            serif: ["'Cormorant Garamond'", "Georgia", "serif"],
            sans: ["'Inter'", "system-ui", "-apple-system", "sans-serif"],
          },
          boxShadow: {
            gold: '0 0 25px -2px rgba(199, 155, 69, 0.4)',
            goldGlow: '0 0 35px rgba(227, 195, 123, 0.45)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #080706;
      color: #FFFFFF;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .fade-enter {
      animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (min-width: 640px) {
      .mobile-frame {
        max-width: 425px;
        min-height: 844px;
        margin: 1.5rem auto;
        border-radius: 44px;
        border: 4px solid #231E18;
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 35px rgba(199, 155, 69, 0.2);
        position: relative;
      }
    }
    .card-preserve-3d {
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Animación de entrada exclusiva para el hexágono dorado sin fondo */
    .logo-entrance {
      animation: logoReveal 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes logoReveal {
      0% {
        opacity: 0;
        transform: scale(0.35) translateY(24px) rotate(-6deg);
        filter: blur(14px) drop-shadow(0 0 0px rgba(199, 155, 69, 0));
      }
      60% {
        transform: scale(1.08) translateY(-4px) rotate(1deg);
        filter: blur(0px) drop-shadow(0 15px 35px rgba(227, 195, 123, 0.6));
      }
      80% {
        transform: scale(0.98) translateY(2px) rotate(-0.5deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0) rotate(0deg);
        filter: blur(0px) drop-shadow(0 12px 30px rgba(199, 155, 69, 0.45));
      }
    }

    .logo-halo {
      animation: haloGlow 3.5s ease-in-out infinite alternate;
    }
    @keyframes haloGlow {
      0% { transform: scale(0.9); opacity: 0.35; }
      100% { transform: scale(1.2); opacity: 0.75; }
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans">

  <div class="mobile-frame min-h-screen w-full flex flex-col justify-between relative bg-[#080706] overflow-x-hidden overflow-y-auto">
    <!-- Lienzo de Partículas Canvas (Constelaciones de Animales y Nombre Delineado con Estrellas y Líneas) -->
    <canvas id="particleCanvas" class="absolute inset-0 pointer-events-none w-full h-full z-10"></canvas>

    <!-- Resplandor Dorado Atmosférico de Fondo -->
    <div class="absolute top-12 left-1/2 -translate-x-1/2 w-80 h-72 bg-amber-500/10 rounded-full blur-3xl pointer-events-none z-0"></div>

    <!-- Cabecera Móvil Limpia: SOLO EL HEXÁGONO SIN CAJAS NI FONDOS -->
    <header class="relative z-20 px-5 pt-6 pb-2 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <img id="headerLogoImg" src="" alt="AuraPets" class="w-8 h-8 object-contain drop-shadow-[0_2px_8px_rgba(199,155,69,0.4)]" />
        <div>
          <span class="text-[11px] font-serif font-bold tracking-[0.25em] uppercase text-aura-gold block leading-none">
            AuraPets
          </span>
          <span class="text-[9px] text-aura-beige/80 tracking-widest uppercase">
            Atelier Esculturas
          </span>
        </div>
      </div>

      <div class="text-[10px] text-aura-gold/80 font-serif italic tracking-wide">
        Bienvenida Oficial
      </div>
    </header>

    <!-- Barra de Progreso (Paso 1 a 6) -->
    <div id="progressContainer" class="relative z-20 px-5 pt-1 hidden">
      <div class="flex items-center justify-between text-[11px] text-aura-beige/70 mb-1.5 font-mono">
        <span id="progressStepText">Paso 1 de 6</span>
        <span id="progressPercentText">17%</span>
      </div>
      <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden">
        <div id="progressBar" class="h-full bg-gradient-to-r from-aura-gold to-amber-300 transition-all duration-500 ease-out shadow-gold" style="width: 17%;"></div>
      </div>
    </div>

    <!-- Contenedor Dinámico de Pasos -->
    <main id="stepContainer" class="relative z-20 flex-1 px-4 sm:px-5 py-4 flex flex-col justify-end text-left pb-6">
      <!-- Inyectado dinámicamente por JavaScript -->
    </main>

    <!-- Barra Inferior de Navegación -->
    <footer id="navFooter" class="relative z-20 px-5 pb-8 pt-2 flex items-center gap-3 hidden">
      <button id="btnBack" type="button" class="w-12 h-12 rounded-2xl bg-white/5 border border-white/10 hover:bg-white/10 flex items-center justify-center text-white/80 active:scale-95 transition-all">
        ←
      </button>
      <button id="btnNext" type="button" class="flex-1 h-12 rounded-2xl bg-gradient-to-r from-aura-gold via-amber-400 to-aura-gold text-black font-semibold text-sm shadow-gold hover:shadow-goldGlow flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
        <span>Continuar</span> →
      </button>
    </footer>
  </div>

    // POST mediante formulario oculto; el Apps Script confirma el resultado con postMessage.
    function submitRegistrationToSheet() {
      const endpoint = window.AURAPETS_CONFIG && window.AURAPETS_CONFIG.GOOGLE_APPS_SCRIPT_URL;
      if (!endpoint || endpoint.includes('PEGA_AQUI')) {
        return Promise.reject(new Error('Falta configurar el receptor de Google Sheets.'));
      }

      return new Promise((resolve, reject) => {
        const requestId = window.crypto && crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        const target = `aurapets-registration-${requestId}`;
        const form = document.createElement('form');
        const frame = document.createElement('iframe');
        let settled = false;
        const cleanup = () => {
          window.removeEventListener('message', onMessage);
          window.clearTimeout(timeoutId);
          form.remove();
          frame.remove();
        };
        const finish = (callback, value) => {
          if (settled) return;
          settled = true;
          cleanup();
          callback(value);
        };
        const onMessage = (event) => {
          const message = event.data;
          if (!message || message.source !== 'aura-artists-registration' || message.requestId !== requestId) return;
          if (message.result && message.result.ok === true) {
            finish(resolve, message.result);
          } else {
            finish(reject, new Error(message.result && message.result.error || 'Google Sheets no confirmó el registro.'));
          }
        };
        const timeoutId = window.setTimeout(() => {
          finish(reject, new Error('No llegó confirmación de Google Sheets en 30 segundos. Revisa tu conexión e inténtalo de nuevo.'));
        }, 30000);

        form.method = 'POST'; form.action = endpoint; form.target = target; form.hidden = true;
        frame.name = target; frame.hidden = true;
        const values = {
          payload: JSON.stringify(registrationPayload()),
          responseMode: 'iframe',
          requestId
        };
        Object.entries(values).forEach(([name, value]) => {
          const input = document.createElement('input');
          input.type = 'hidden'; input.name = name; input.value = value;
          form.appendChild(input);
        });
        window.addEventListener('message', onMessage);
        document.body.appendChild(frame);
        document.body.appendChild(form);
        try {
          form.submit();
        } catch (error) {
          finish(reject, error instanceof Error ? error : new Error('No se pudo enviar el registro.'));
        }
      });
    }

      const dpr = window.devicePixelRatio || 1;

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const baseAlpha = 0.35 + Math.random() * 0.65;
        const color = GOLD_COLORS[Math.floor(Math.random() * GOLD_COLORS.length)];
        const igniteDelay = 0.4 + (i / PARTICLE_COUNT) * INTRO_DURATION + (Math.sin(i * 9.7) * 0.25);

        particles.push({
          x: 0,
          y: 0,
          targetX: width / 2,
          targetY: height / 2,
          vx: 0,
          vy: 0,
          size: 0,
          currentSize: 0,
          targetSize: 0.8 * dpr,
          alpha: 0,
          currentAlpha: 0,
          targetAlpha: baseAlpha,
          baseAlpha,
          color,
          isMajorNode: false,
          speed: 0.004 + Math.random() * 0.006,
          noiseSeed: Math.random() * 100,
          ignited: false,
          igniteDelay: Math.max(0.3, igniteDelay)
        });
      }
    }

// --- DICCIONARIO VECTORIAL GEOMÉTRICO PARA CONSTELACIONES DE LETRAS (A-Z, Ñ, 0-9) ---
    // Cada letra se define mediante trazos limpios de línea única (como las estrellas de Orión y el Can Mayor)
    const FONT_VECTORS = {
      'A': { width: 0.85, strokes: [[[0.08, 1.0], [0.425, 0.0]], [[0.425, 0.0], [0.77, 1.0]], [[0.22, 0.62], [0.63, 0.62]]] },
      'B': { width: 0.78, strokes: [[[0.12, 0.0], [0.12, 1.0]], [[0.12, 0.0], [0.52, 0.0], [0.74, 0.22], [0.52, 0.48], [0.12, 0.48]], [[0.12, 0.48], [0.55, 0.48], [0.76, 0.74], [0.55, 1.0], [0.12, 1.0]]] },
      'C': { width: 0.78, strokes: [[[0.74, 0.18], [0.46, 0.0], [0.18, 0.22], [0.12, 0.5], [0.18, 0.78], [0.46, 1.0], [0.74, 0.82]]] },
      'D': { width: 0.80, strokes: [[[0.12, 0.0], [0.12, 1.0]], [[0.12, 0.0], [0.5, 0.0], [0.76, 0.24], [0.78, 0.5], [0.76, 0.76], [0.5, 1.0], [0.12, 1.0]]] },
      'E': { width: 0.72, strokes: [[[0.12, 0.0], [0.12, 1.0]], [[0.12, 0.0], [0.72, 0.0]], [[0.12, 0.5], [0.58, 0.5]], [[0.12, 1.0], [0.72, 1.0]]] },
      'F': { width: 0.70, strokes: [[[0.12, 0.0], [0.12, 1.0]], [[0.12, 0.0], [0.70, 0.0]], [[0.12, 0.5], [0.56, 0.5]]] },
      'G': { width: 0.82, strokes: [[[0.76, 0.18], [0.46, 0.0], [0.18, 0.22], [0.12, 0.5], [0.18, 0.78], [0.46, 1.0], [0.78, 0.84], [0.78, 0.52], [0.50, 0.52]]] },
      'H': { width: 0.82, strokes: [[[0.12, 0.0], [0.12, 1.0]], [[0.78, 0.0], [0.78, 1.0]], [[0.12, 0.5], [0.78, 0.5]]] },
      'I': { width: 0.38, strokes: [[[0.08, 0.0], [0.30, 0.0]], [[0.19, 0.0], [0.19, 1.0]], [[0.08, 1.0], [0.30, 1.0]]] },
      'J': { width: 0.65, strokes: [[[0.20, 0.0], [0.58, 0.0]], [[0.52, 0.0], [0.52, 0.75], [0.42, 0.95], [0.25, 1.0], [0.10, 0.85], [0.08, 0.70]]] },
      'K': { width: 0.78, strokes: [[[0.12, 0.0], [0.12, 1.0]], [[0.74, 0.0], [0.12, 0.55]], [[0.22, 0.48], [0.75, 1.0]]] },
      'L': { width: 0.68, strokes: [[[0.14, 0.0], [0.14, 1.0]], [[0.14, 1.0], [0.68, 1.0]]] },
      'M': { width: 0.95, strokes: [[[0.10, 1.0], [0.10, 0.0], [0.475, 0.65], [0.85, 0.0], [0.85, 1.0]]] },
      'N': { width: 0.82, strokes: [[[0.12, 1.0], [0.12, 0.0], [0.76, 1.0], [0.76, 0.0]]] },
      'Ñ': { width: 0.82, strokes: [[[0.12, 1.0], [0.12, 0.0], [0.76, 1.0], [0.76, 0.0]], [[0.22, -0.15], [0.38, -0.22], [0.50, -0.12], [0.66, -0.18]]] },
      'O': { width: 0.85, strokes: [[[0.425, 0.0], [0.72, 0.14], [0.82, 0.5], [0.72, 0.86], [0.425, 1.0], [0.13, 0.86], [0.03, 0.5], [0.13, 0.14], [0.425, 0.0]]] },
      'P': { width: 0.76, strokes: [[[0.12, 0.0], [0.12, 1.0]], [[0.12, 0.0], [0.54, 0.0], [0.76, 0.25], [0.54, 0.52], [0.12, 0.52]]] },
      'Q': { width: 0.85, strokes: [[[0.425, 0.0], [0.72, 0.14], [0.82, 0.5], [0.72, 0.86], [0.425, 1.0], [0.13, 0.86], [0.03, 0.5], [0.13, 0.14], [0.425, 0.0]], [[0.55, 0.72], [0.82, 1.05]]] },
      'R': { width: 0.80, strokes: [[[0.12, 0.0], [0.12, 1.0]], [[0.12, 0.0], [0.54, 0.0], [0.76, 0.24], [0.54, 0.50], [0.12, 0.50]], [[0.46, 0.50], [0.78, 1.0]]] },
      'S': { width: 0.75, strokes: [[[0.70, 0.18], [0.42, 0.0], [0.18, 0.16], [0.18, 0.38], [0.42, 0.5], [0.72, 0.65], [0.72, 0.86], [0.42, 1.0], [0.15, 0.84]]] },
      'T': { width: 0.76, strokes: [[[0.06, 0.0], [0.70, 0.0]], [[0.38, 0.0], [0.38, 1.0]]] },
      'U': { width: 0.80, strokes: [[[0.12, 0.0], [0.12, 0.72], [0.22, 0.95], [0.44, 1.0], [0.66, 0.95], [0.76, 0.72], [0.76, 0.0]]] },
      'V': { width: 0.82, strokes: [[[0.10, 0.0], [0.44, 1.0], [0.78, 0.0]]] },
      'W': { width: 1.05, strokes: [[[0.08, 0.0], [0.28, 1.0], [0.525, 0.40], [0.77, 1.0], [0.97, 0.0]]] },
      'X': { width: 0.80, strokes: [[[0.10, 0.0], [0.76, 1.0]], [[0.76, 0.0], [0.10, 1.0]]] },
      'Y': { width: 0.78, strokes: [[[0.10, 0.0], [0.42, 0.50]], [[0.74, 0.0], [0.42, 0.50]], [[0.42, 0.50], [0.42, 1.0]]] },
      'Z': { width: 0.76, strokes: [[[0.10, 0.0], [0.72, 0.0]], [[0.72, 0.0], [0.10, 1.0]], [[0.10, 1.0], [0.72, 1.0]]] }
    };

    // GENERADOR DE TRAZADOS Y ESTRELLAS VECTORIALES PARA EL PRIMER NOMBRE
    function buildVectorNameConstellation(name) {
      const dpr = window.devicePixelRatio || 1;
      const isMobile = width < 768 * dpr;

      // Normalizar texto: sólo primer nombre en mayúsculas, sin tildes pero conservando Ñ
      let clean = (name || 'ARTISTA')
        .replace(/Ñ/g, '__ENYE__')
        .normalize('NFD')
        .replace(/[̀-ͯ]/g, '')
        .replace(/__ENYE__/g, 'Ñ')
        .toUpperCase()
        .replace(/[^A-Z0-9Ñ]/g, '');
      if (!clean) clean = 'ARTISTA';

      const letters = clean.split('');
      let totalUnits = 0;
      const letterGap = 0.18;
      for (let i = 0; i < letters.length; i++) {
        const g = FONT_VECTORS[letters[i]] || { width: 0.75, strokes: [] };
        totalUnits += g.width;
      }
      totalUnits += (letters.length - 1) * letterGap;

      // Tamaño de caja máxima y centrado en la zona superior estelar
      const boxW = isMobile ? Math.min(width * 0.90, 380 * dpr) : Math.min(width * 0.70, 480 * dpr);
      const boxH = isMobile ? Math.min(height * 0.16, 85 * dpr) : Math.min(height * 0.18, 105 * dpr);
      
      const scale = Math.min(boxW / totalUnits, boxH);
      const actualW = totalUnits * scale;

      const centerX = width / 2;
      const centerY = isMobile ? Math.round(112 * dpr) : Math.round(135 * dpr);
      const startX = centerX - actualW / 2;
      const startY = centerY - scale / 2;

      const lines = [];
      const rawPoints = [];
      let curX = startX;

      for (let l = 0; l < letters.length; l++) {
        const char = letters[l];
        const glyph = FONT_VECTORS[char] || { width: 0.75, strokes: [] };
        const w = glyph.width * scale;

        for (let sIdx = 0; sIdx < glyph.strokes.length; sIdx++) {
          const stroke = glyph.strokes[sIdx];
          for (let i = 0; i < stroke.length - 1; i++) {
            const p1 = stroke[i];
            const p2 = stroke[i + 1];
            const x1 = curX + p1[0] * scale;
            const y1 = startY + p1[1] * scale;
            const x2 = curX + p2[0] * scale;
            const y2 = startY + p2[1] * scale;

            lines.push([x1, y1, x2, y2]);

            // Muestrear estrellas intermedias a lo largo de cada trazo (~5.5px por estrella)
            const dx = x2 - x1;
            const dy = y2 - y1;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const steps = Math.max(1, Math.round(dist / (5.2 * dpr)));
            for (let s = 0; s <= steps; s++) {
              const t = s / steps;
              const px = x1 + dx * t;
              const py = y1 + dy * t;
              const isNode = (s === 0 || s === steps);
              rawPoints.push({ x: px, y: py, isNode });
            }
          }
        }
        curX += w + letterGap * scale;
      }

      // Fusionar puntos muy cercanos para evitar duplicados en vértices comunes
      const points = [];
      const minDistSq = (2.6 * dpr) * (2.6 * dpr);
      for (let i = 0; i < rawPoints.length; i++) {
        const rp = rawPoints[i];
        let found = false;
        for (let j = 0; j < points.length; j++) {
          const ddx = points[j].x - rp.x;
          const ddy = points[j].y - rp.y;
          if (ddx * ddx + ddy * ddy < minDistSq) {
            if (rp.isNode) points[j].isNode = true;
            found = true;
            break;
          }
        }
        if (!found) {
          points.push({ x: rp.x, y: rp.y, isNode: rp.isNode });
        }
      }

      return { lines, points, scale, actualW, centerX, centerY };
    }

    function updateTargets() {
      const dpr = window.devicePixelRatio || 1;
      const isMobile = width < 768 * dpr;

      if (currentAnimal === 'text') {
        const constellation = buildVectorNameConstellation(getFirstName());
        textConstellationLines = constellation.lines || [];
        const letterPoints = constellation.points || [];

        particles.forEach((p, idx) => {
          if (idx < letterPoints.length) {
            const pt = letterPoints[idx];
            p.targetX = pt.x;
            p.targetY = pt.y;
            p.targetSize = (pt.isNode ? 2.1 : 1.15) * dpr;
            p.targetAlpha = 0.95;
            p.isMajorNode = pt.isNode;
          } else {
            // Polvo estelar ambiental orbitando con sutileza alrededor del nombre
            const angle = idx * 0.22;
            const rx = (constellation.actualW * 0.52) + (Math.sin(idx * 1.5 + p.noiseSeed) * 25 * dpr);
            const ry = (constellation.scale * 0.65) + (Math.cos(idx * 1.2 + p.noiseSeed) * 18 * dpr);
            p.targetX = constellation.centerX + Math.cos(angle) * rx;
            p.targetY = constellation.centerY + Math.sin(angle) * ry;
            p.targetSize = (0.4 + Math.random() * 0.45) * dpr;
            p.targetAlpha = 0.12 + Math.random() * 0.25;
            p.isMajorNode = false;
          }
        });
        return;
      }

      const trace = EXACT_TRACES[currentAnimal];
      if (!trace) return;
      const points = trace.points || [];

      const scale = isMobile ? Math.min(width * 0.78, 330 * dpr) : Math.min(width * 0.55, 360 * dpr);
      const offsetX = (width - scale) / 2;
      const offsetY = isMobile ? height * 0.07 : height * 0.09;

      particles.forEach((p, idx) => {
        if (idx < points.length) {
          const pt = points[idx];
          p.targetX = offsetX + pt[0] * scale;
          p.targetY = offsetY + pt[1] * scale;
          p.targetSize = (pt[2] || 1.0) * dpr * 0.75;
          p.targetAlpha = pt[3] || 0.85;
          p.isMajorNode = (pt[2] >= 1.5);
        } else {
          const angle = (idx * 0.15);
          const dist = (scale * 0.55) + (Math.sin(idx + p.noiseSeed) * 45 * dpr);
          p.targetX = width / 2 + Math.cos(angle) * dist;
          p.targetY = offsetY + scale * 0.5 + Math.sin(angle) * dist;
          p.targetSize = (0.5 + Math.random() * 0.5) * dpr;
          p.targetAlpha = 0.15 + Math.random() * 0.3;
          p.isMajorNode = false;
        }
      });
    }

    function setAnimal(animalName) {
      if (currentAnimal === animalName && linesAlpha > 0.8) return;
      currentAnimal = animalName;
      linesAlpha = 0;

      // Dispersión suave en cámara lenta (a la mitad de velocidad)
      particles.forEach(p => {
        p.vx += (Math.random() - 0.5) * 1.8;
        p.vy += (Math.random() - 0.5) * 1.8;
      });

      updateTargets();
    }

    let animTime = 0;

    function renderParticles(timestamp) {
      if (!animStartTime) animStartTime = timestamp;
      const elapsedSec = (timestamp - animStartTime) / 1000;
      animTime += 0.012;
      
      ctx.clearRect(0, 0, width, height);
      const dpr = window.devicePixelRatio || 1;

      const isMobile = width < 768 * dpr;
      const scale = isMobile ? Math.min(width * 0.78, 330 * dpr) : Math.min(width * 0.55, 360 * dpr);
      const offsetX = (width - scale) / 2;
      const offsetY = isMobile ? height * 0.07 : height * 0.09;

      // Gestión de líneas
      if (isIntroVoid) {
        if (elapsedSec < 3.2) {
          linesAlpha = 0;
        } else {
          linesAlpha = Math.min(1.0, linesAlpha + 0.005);
          if (elapsedSec > 5.5 && linesAlpha >= 1.0) {
            isIntroVoid = false;
          }
        }
      } else {
        if (linesAlpha < 1.0) {
          linesAlpha = Math.min(1.0, linesAlpha + 0.008);
        }
      }

      // 1. DIBUJAR LÍNEAS DE CONSTELACIÓN (ANIMALES O TEXTO)
      if (currentAnimal === 'text') {
        if (textConstellationLines.length > 0 && linesAlpha > 0.02) {
          ctx.save();
          ctx.lineWidth = 0.8 * dpr;
          ctx.strokeStyle = "rgba(245, 215, 127, " + (0.55 * linesAlpha).toFixed(3) + ")";
          ctx.beginPath();
          for (let i = 0; i < textConstellationLines.length; i++) {
            const l = textConstellationLines[i];
            ctx.moveTo(l[0], l[1]);
            ctx.lineTo(l[2], l[3]);
          }
          ctx.stroke();
          ctx.restore();
        }
      } else {
        const trace = EXACT_TRACES[currentAnimal];
        if (trace && trace.lines && linesAlpha > 0.02) {
          ctx.save();
          ctx.lineWidth = 0.5 * dpr;
          ctx.strokeStyle = "rgba(245, 215, 127, " + (0.32 * linesAlpha).toFixed(3) + ")";
          ctx.beginPath();
          const lines = trace.lines;
          for (let i = 0; i < lines.length; i++) {
            const l = lines[i];
            ctx.moveTo(offsetX + l[0] * scale, offsetY + l[1] * scale);
            ctx.lineTo(offsetX + l[2] * scale, offsetY + l[3] * scale);
          }
          ctx.stroke();
          ctx.restore();
        }
      }

      // 2. DIBUJAR Y ATRAER PUNTOS
      const isTextMode = (currentAnimal === 'text');
      const attraction = isTextMode ? 0.018 : 0.0075;
      const friction = isTextMode ? 0.91 : 0.93;

      particles.forEach((p, i) => {
        if (!p.ignited) {
          if (elapsedSec >= p.igniteDelay) {
            p.ignited = true;
            const angle = Math.random() * Math.PI * 2;
            const dist = (25 + Math.random() * 85) * dpr;
            p.x = p.targetX + Math.cos(angle) * dist;
            p.y = p.targetY + Math.sin(angle) * dist;
            p.vx = (Math.random() - 0.5) * 0.3;
            p.vy = (Math.random() - 0.5) * 0.3;
            p.currentAlpha = 0.0;
            p.currentSize = 0.0;
          } else {
            return;
          }
        }

        const breathX = isTextMode ? 0 : Math.sin(animTime * 0.8 + i * 0.04) * (0.35 * dpr);
        const breathY = isTextMode ? 0 : Math.cos(animTime * 0.8 + i * 0.04) * (0.35 * dpr);

        const dx = (p.targetX + breathX) - p.x;
        const dy = (p.targetY + breathY) - p.y;
        
        p.vx += dx * attraction;
        p.vy += dy * attraction;
        p.vx *= friction;
        p.vy *= friction;

        const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        const maxSpeed = (isTextMode ? 2.8 : 1.4) * dpr;
        if (speed > maxSpeed) {
          p.vx = (p.vx / speed) * maxSpeed;
          p.vy = (p.vy / speed) * maxSpeed;
        }

        p.x += p.vx;
        p.y += p.vy;

        p.currentSize += (p.targetSize - p.currentSize) * (isTextMode ? 0.07 : 0.025);
        p.currentAlpha += (p.targetAlpha - p.currentAlpha) * (isTextMode ? 0.07 : 0.025);

        const flickerAlpha = p.currentAlpha * (0.88 + 0.22 * Math.sin(animTime * 1.6 + i));

        if (p.isMajorNode) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.currentSize * 2.2, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(227, 195, 123, " + (flickerAlpha * 0.25).toFixed(3) + ")";
          ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0.1, p.currentSize), 0, Math.PI * 2);
        ctx.fillStyle = p.color + Math.min(1.0, flickerAlpha).toFixed(3) + ")";
        ctx.fill();
      });

      requestAnimationFrame(renderParticles);
    }

    window.addEventListener('resize', resizeCanvas);
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => resizeCanvas());
      ro.observe(canvas.parentElement || document.body);
    }
    initParticles();
    resizeCanvas();
    renderParticles();
    setAnimal('dog');

    // Sincronizar fuentes de imágenes del logo transparente
    function syncLogoImages() {
      const headerLogo = document.getElementById('headerLogoImg');
      if (headerLogo && !headerLogo.src.startsWith('data:')) headerLogo.src = LOGO_BASE64;
      const welcomeLogo = document.getElementById('welcomeLogoImg');
      if (welcomeLogo && !welcomeLogo.src.startsWith('data:')) welcomeLogo.src = LOGO_BASE64;
      const badgeLogo = document.getElementById('badgeLogoImg');
      if (badgeLogo && !badgeLogo.src.startsWith('data:')) badgeLogo.src = LOGO_BASE64;
    }

    // Confetti dorado estelar
    function triggerConfetti() {
      const colors = ['#C79B45', '#E3C37B', '#FFF4D6', '#D4AF37', '#FFFFFF'];
      for (let i = 0; i < 80; i++) {
        const conf = document.createElement('div');
        conf.className = 'absolute z-50 pointer-events-none rounded-sm';
        const size = 5 + Math.random() * 8;
        conf.style.width = size + 'px';
        conf.style.height = size + 'px';
        conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        conf.style.left = (25 + Math.random() * 50) + '%';
        conf.style.top = '30%';
        conf.style.transition = 'all 1.7s cubic-bezier(0.25, 1, 0.5, 1)';
        conf.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
        document.body.appendChild(conf);

        setTimeout(() => {
          conf.style.transform = 'translate(' + ((Math.random() - 0.5) * 380) + 'px, ' + (150 + Math.random() * 340) + 'px) rotate(' + (Math.random() * 720) + 'deg)';
          conf.style.opacity = '0';
        }, 20);

        setTimeout(() => conf.remove(), 1800);
      }
    }

    // Navegación directa para corregir cualquier dato desde el resumen
    window.goToStep = function(stepNum) {
      returningToSummary = true;
      currentStep = stepNum;
      renderStep();
    };

    // --- RENDERIZADOR DE PASOS INTERACTIVOS (6 PREGUNTAS CLAVE) ---
    const stepContainer = document.getElementById('stepContainer');
    const navFooter = document.getElementById('navFooter');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressStepText = document.getElementById('progressStepText');
    const progressPercentText = document.getElementById('progressPercentText');
    const btnNext = document.getElementById('btnNext');
    const btnBack = document.getElementById('btnBack');

    function renderStep() {
      if (currentStep === 0 || currentStep > TOTAL_STEPS) {
        progressContainer.classList.add('hidden');
        navFooter.classList.add('hidden');
      } else {
        progressContainer.classList.remove('hidden');
        navFooter.classList.remove('hidden');
        const percent = Math.round((currentStep / TOTAL_STEPS) * 100);
        progressBar.style.width = percent + '%';
        progressStepText.innerText = 'Paso ' + currentStep + ' de ' + TOTAL_STEPS;
        progressPercentText.innerText = percent + '%';
        
        if (returningToSummary) {
          btnNext.innerHTML = '<span>Guardar y Volver al Resumen ✨</span> →';
        } else {
          btnNext.innerHTML = currentStep === TOTAL_STEPS 
            ? '<span>Finalizar y Ver mi Bienvenida ✨</span> →' 
            : '<span>Continuar</span> →';
        }
      }

      // ROTACIÓN EN CADA PREGUNTA INDIVIDUAL
      if (currentStep === 0) {
        setAnimal('dog');
      } else if (currentStep === 7) {
        // EN EL PASO FINAL: Las partículas forman el primer nombre legal con BIENVENIDA / BIENVENIDO y líneas
        currentAnimal = 'text';
        linesAlpha = 0;
        updateTargets();
        triggerConfetti();
      } else {
        const animalIndex = currentStep % ANIMAL_SEQUENCE.length;
        setAnimal(ANIMAL_SEQUENCE[animalIndex]);
      }

      stepContainer.innerHTML = '';
      const div = document.createElement('div');
      div.className = 'fade-enter flex flex-col justify-end w-full';

      switch (currentStep) {
        case 0:
          div.innerHTML = `
            <div class="text-center mb-6 pt-32 sm:pt-40 flex flex-col items-center">
              <!-- LOGO OFICIAL TRANSPARENTE: SOLO EL HEXÁGONO SIN RECUADROS NI CAJAS NEGRAS -->
              <div class="relative mb-5 flex items-center justify-center">
                <div class="logo-halo absolute w-44 h-44 bg-amber-400/20 rounded-full blur-3xl pointer-events-none"></div>

        return;
      }
      if (currentStep === 5 && (!formData.city.trim() || !formData.address.trim())) {
        alert('Por favor ingresa la ciudad y dirección de entrega.');
        return;
      }
      if (currentStep === 6 && (!formData.emergencyContactName.trim() || !formData.emergencyContactPhone.trim())) {
        alert('Por favor completa el contacto de emergencia.');
        return;
      }

      if (returningToSummary) {
        returningToSummary = false;
        currentStep = 7;
        renderStep();
        return;
      }

      if (currentStep < TOTAL_STEPS) {
        currentStep++;
        renderStep();
      } else if (currentStep === TOTAL_STEPS) {
        currentStep = 7;
        renderStep();
      }
    };

    btnBack.onclick = () => {
      if (returningToSummary) {
        returningToSummary = false;
        currentStep = 7;
        renderStep();
        return;
      }

      if (currentStep > 1) {
        currentStep--;
        renderStep();
      } else if (currentStep === 1) {
        currentStep = 0;
        renderStep();
      }
    };

    renderStep();
    syncLogoImages();
  </script>
</body>
</html>
